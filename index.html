<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{
  --gold:#d4af37;
  --bg:rgba(0,0,0,.35);
  --border:rgba(212,175,55,.35);
  --white:#fff;
  --muted:rgba(255,255,255,.75);
}

.calc-agent{
  max-width:520px;
  margin:auto;
  padding:16px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:16px;
  color:var(--white);
  font-family:Arial,system-ui,sans-serif;
}

.calc-agent h2{
  margin:0 0 6px;
  font-size:18px;
  font-weight:900;
}

.calc-agent p{
  margin:0 0 14px;
  font-size:13px;
  color:var(--muted);
}

.input{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:12px;
}

.input input{
  flex:1;
  background:transparent;
  border:0;
  outline:none;
  color:var(--white);
  font-size:16px;
  font-weight:900;
}

.unit{ color:var(--gold); font-weight:900; }

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

button{
  padding:10px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.35);
  color:var(--white);
  font-weight:900;
  cursor:pointer;
}

button.active{
  background:linear-gradient(135deg,#e3c15a,#b38a28);
  color:#000;
  border:none;
}

.result{
  padding:14px;
  border-radius:14px;
  background:rgba(0,0,0,.45);
  border:1px solid var(--border);
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(212,175,55,.25);
  border:1px solid var(--gold);
  font-size:12px;
  font-weight:900;
  margin-bottom:8px;
}

.big{
  font-size:34px;
  font-weight:900;
  margin:6px 0;
}

.small{
  font-size:13px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="calc-agent">
  <h2>Calculateur Agent / Manager</h2>
  <p>Entre le total mensuel et ajuste selon la performance.</p>

  <div class="input">
    <input type="number" id="montant" placeholder="0" min="0">
    <span class="unit">💎</span>
  </div>

  <div class="buttons">
    <button id="bad">Mauvais mois</button>
     <button id="normal" class="active">Mois normal</button>
    <button id="good">Très bon mois</button>
  </div>

  <div class="result">
    <div class="badge" id="taux">Taux : 0%</div>
    <div class="big" id="gain">0</div>
    <div class="small" id="detail">Entre un montant pour calculer.</div>
  </div>
</div>

<script>
const nf = new Intl.NumberFormat("fr-FR");

const montant = document.getElementById("montant");
const gain = document.getElementById("gain");
const tauxEl = document.getElementById("taux");
const detail = document.getElementById("detail");
const normal = document.getElementById("normal");
  

const bad = document.getElementById("bad");
const good = document.getElementById("good");

let bonus = 1;

function getTaux(v){
  if(v >= 3000000) return 3;
  if(v >= 2000000) return 2.5;
  if(v >= 1000000) return 2;
  if(v > 0) return 1.5;
  return 0;
}

function calcul(){
  const v = Number(montant.value) || 0;
  const taux = getTaux(v);

  let base = Math.floor(v * taux / 100);
  let final = Math.floor(base * bonus);

  tauxEl.textContent = `Taux : ${String(taux).replace(".",",")}%`;
  gain.textContent = nf.format(final);

  if(bonus === 0.7){
    detail.textContent = "Mauvais mois : –30% appliqué.";
  } else if(bonus === 1.3){
    detail.textContent = "Très bon mois : +30% appliqué.";
  } else {
    detail.textContent = "Mois normal : aucun bonus ni malus.";
  }
}

montant.addEventListener("input", calcul);

bad.onclick = () => {
  bonus = 0.7;
  bad.classList.add("active");
  good.classList.remove("active");
  calcul();
};

good.onclick = () => {
  bonus = 1.3;
  good.classList.add("active");
  bad.classList.remove("active");
  calcul();
};
  normal.onclick = () => {
  bonus = 1;
  normal.classList.add("active");
  bad.classList.remove("active");
  good.classList.remove("active");
  calcul();
};

</script>

</body>
</html>
